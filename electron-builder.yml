# Packages the Electron shell (electron/) + the already-built Next.js standalone
# server (.next/standalone, copied into app-server/) into a single Windows installer.
# Run via `npm run dist:win` (builds Next.js first, then this).
appId: mn.lordrantracker.desktop
productName: Lordran Tracker
copyright: Copyright (c) 2026 Lordran Tracker contributors

directories:
  app: electron
  output: dist
  buildResources: build

# The shell (main.js + electron-updater) is bundled into dist/main.js by
# build/bundle-electron.mjs before packaging, so there's no node_modules to rebuild here —
# and, not incidentally, electron-builder's hard-coded `!**/node_modules/**` default ignore
# (which an explicit "files" entry cannot override) can't strip anything out.
npmRebuild: false

files:
  - "dist/main.js"
  - "package.json"

# Plain directory instead of a packed archive: simpler, and afterPack needs to freely
# add/remove files in resources/ without unpacking/repacking an asar.
asar: false

# electron-builder's automatic node_modules collection gets confused by this project's
# layout (walks up to the web app's own node_modules and mis-places things); afterPack
# places resources/app-server (the Next.js standalone server) by hand instead — see
# build/after-pack.cjs.
afterPack: build/after-pack.cjs

icon: build/icon.png

# Where electron-updater looks for new versions: the same public Vercel Blob store the
# installer itself is uploaded to (see src/lib/downloads.ts). electron-builder writes
# latest.yml here on every build; it — and the installer + .blockmap — get uploaded to
# this store by hand (no CI publish step) — see build/PUBLISHING.md.
publish:
  provider: generic
  url: https://bpcne2nkaruzhq1b.public.blob.vercel-storage.com/

win:
  target: nsis
  icon: build/icon.ico
  # No space in the file name: latest.yml, the site's /download redirect and the Blob URL
  # all use this one name, so each release uploads a single installer.
  artifactName: "Lordran-Tracker-Setup-${version}.${ext}"

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
